<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">
  <div class="min-h-screen flex flex-col md:flex-row">
    <aside class="w-full md:w-64 bg-slate-800 text-white flex flex-col justify-between p-4">
      <div>
        <div class="text-xl font-bold mb-6 text-center text-indigo-400">AdminPanel</div>
        <nav class="space-y-1">
          <a href="dashboard.html" class="block px-4 py-2.5 bg-slate-700 rounded text-white font-medium">Dashboard</a>
          <a href="products.html" class="block px-4 py-2.5 rounded hover:bg-slate-700 transition">Products</a>
          <a href="#" class="block px-4 py-2.5 rounded hover:bg-slate-700 transition">Users</a>
          <a href="#" class="block px-4 py-2.5 rounded hover:bg-slate-700 transition">Setting</a>
        </nav>
      </div>
      <a href="index.html" class="block text-center bg-red-600 hover:bg-red-700 py-2 rounded text-sm font-medium transition mt-6">Logout</a>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <h1 class="text-lg font-semibold text-gray-700">Dashboard E-Commerce</h1>
        <div class="text-sm text-gray-500">Halo, <span class="font-bold text-gray-700">Administrator</span></div>
      </header>

      <main class="flex-1 p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Overview Statistik</h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
          <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
            <span class="text-sm text-gray-500 font-medium">Total Penjualan</span>
            <div class="text-2xl font-bold text-indigo-600 mt-2">Rp 45.200.000</div>
          </div>
          
          <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
            <span class="text-sm text-gray-500 font-medium">Total Pesanan</span>
            <div class="text-2xl font-bold text-emerald-600 mt-2">1,280</div>
          </div>
          
          <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
            <span class="text-sm text-gray-500 font-medium">Total Produk</span>
            <div class="text-2xl font-bold text-amber-600 mt-2">342 Item</div>
          </div>
          
          <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
            <span class="text-sm text-gray-500 font-medium">Pelanggan Aktif</span>
            <div class="text-2xl font-bold text-blue-600 mt-2">892 User</div>
          </div>
        </div>
      </main>

      <footer class="bg-white border-t p-4 text-center text-sm text-gray-500">
        &copy; 2026 Admin Dashboard. All rights reserved.
      </footer>
    </div>
  </div>
</body>
</html>
