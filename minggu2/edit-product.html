<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Produk</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">
  <div class="min-h-screen flex flex-col md:flex-row">
    <aside class="w-full md:w-64 bg-slate-800 text-white flex flex-col justify-between p-4">
      <div>
        <div class="text-xl font-bold mb-6 text-center text-indigo-400">AdminPanel</div>
        <nav class="space-y-1">
          <a href="dashboard.html" class="block px-4 py-2.5 rounded hover:bg-slate-700 transition">Dashboard</a>
          <a href="products.html" class="block px-4 py-2.5 bg-slate-700 rounded text-white font-medium">Products</a>
          <a href="#" class="block px-4 py-2.5 rounded hover:bg-slate-700 transition">Users</a>
          <a href="#" class="block px-4 py-2.5 rounded hover:bg-slate-700 transition">Setting</a>
        </nav>
      </div>
      <a href="index.html" class="block text-center bg-red-600 hover:bg-red-700 py-2 rounded text-sm font-medium transition mt-6">Logout</a>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <h1 class="text-lg font-semibold text-gray-700">Form Produk</h1>
        <div class="text-sm text-gray-500">Halo, <span class="font-bold text-gray-700">Administrator</span></div>
      </header>

      <main class="flex-1 p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Edit Produk</h2>

        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 max-w-2xl">
          <form action="products.html" method="GET" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
              <input type="text" value="Iga Bakar" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Stock</label>
              <input type="number" value="25" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
              <textarea rows="4" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">Iga sapi bakar dengan bumbu spesial</textarea>
            </div>

            <div class="flex space-x-2 pt-2">
              <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-medium transition">
                Update
              </button>
              <a href="products.html" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-5 py-2 rounded-lg font-medium transition">
                Batal
              </a>
            </div>
          </form>
        </div>
      </main>

      <footer class="bg-white border-t p-4 text-center text-sm text-gray-500">
        &copy; 2026 Admin Dashboard. All rights reserved.
      </footer>
    </div>
  </div>
</body>
</html>
